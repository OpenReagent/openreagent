# Local PostgreSQL for the OpenReagent remote signature store.
#
#   docker compose up -d
#   export OPENREAGENT_DB_URL=postgresql://openreagent:openreagent@localhost:5432/openreagent
#   openreagent sig list
#
# There is no local file-based store; the store is always a remote database.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: openreagent
      POSTGRES_PASSWORD: openreagent
      POSTGRES_DB: openreagent
    ports:
      - "5432:5432"
    volumes:
      - openreagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openreagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  openreagent_pgdata:
